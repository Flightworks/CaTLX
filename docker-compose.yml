services:
  backend:
    build: ./backend
    container_name: catlx-backend
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      - NODE_ENV=production
      - PORT=8099
      - DB_PATH=/app/data/data.sqlite
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8099/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8099/api}
    container_name: catlx-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy


volumes:
  backend-data:
    driver: local
